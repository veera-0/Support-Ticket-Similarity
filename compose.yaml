services:
  api:
    build:
      context: ./semantic-search-api
    command: ["node", "/app/src/Server.js"]
    working_dir: /data
    expose:
      - "8081"
    volumes:
      - ticket-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8081/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5m
    restart: unless-stopped

  frontend:
    build:
      context: ./ticket-dashboard-app
      args:
        VITE_API_URL: /api
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${PORT:-8080}:80"
    restart: unless-stopped

volumes:
  ticket-data:
